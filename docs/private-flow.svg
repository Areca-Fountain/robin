<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="250" viewBox="0 0 1100 250" role="img" aria-label="Private letter flow: company issues, employee holds the credential, verifier asks one question, employee proves it, verifier sees the answer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <style>
      text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .flow { stroke-dasharray: 7 9; animation: flow 1.2s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -32; } }
      .n { animation: lit 7.5s ease-in-out infinite; }
      .n1 { animation-delay: 0s; } .n2 { animation-delay: 1.5s; } .n3 { animation-delay: 3s; }
      .n4 { animation-delay: 4.5s; } .n5 { animation-delay: 6s; }
      @keyframes lit { 0%, 20%, 100% { fill: #ffffff; stroke: #cbd5e1; } 8%, 14% { fill: #dbeafe; stroke: #2563eb; } }
      .t { fill: #0f172a; font-size: 17px; font-weight: 700; }
      .s { fill: #475569; font-size: 13px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1100" height="250" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>

  <g stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <line class="flow" x1="178" y1="105" x2="226" y2="105"/>
    <line class="flow" x1="398" y1="105" x2="446" y2="105"/>
    <line class="flow" x1="618" y1="105" x2="666" y2="105"/>
    <line class="flow" x1="838" y1="105" x2="886" y2="105"/>
  </g>

  <g stroke-width="2.5">
    <rect class="n n1" x="30"  y="55" width="148" height="100" rx="16"/>
    <rect class="n n2" x="230" y="55" width="168" height="100" rx="16"/>
    <rect class="n n3" x="450" y="55" width="168" height="100" rx="16"/>
    <rect class="n n4" x="670" y="55" width="168" height="100" rx="16"/>
    <rect class="n n5" x="890" y="55" width="180" height="100" rx="16"/>
  </g>

  <g text-anchor="middle">
    <text class="t" x="104" y="97">Company</text>
    <text class="s" x="104" y="120">issues the letter</text>
    <text class="s" x="104" y="138">(hash only)</text>

    <text class="t" x="314" y="97">Employee</text>
    <text class="s" x="314" y="120">keeps the private</text>
    <text class="s" x="314" y="138">credential file</text>

    <text class="t" x="534" y="97">Verifier</text>
    <text class="s" x="534" y="120">asks for ONE fact</text>
    <text class="s" x="534" y="138">and sends a link</text>

    <text class="t" x="754" y="97">Employee</text>
    <text class="s" x="754" y="120">proves it in the</text>
    <text class="s" x="754" y="138">browser (ZK proof)</text>

    <text class="t" x="980" y="97">Verifier</text>
    <text class="s" x="980" y="120">sees "Proof valid"</text>
    <text class="s" x="980" y="138">and the company</text>
  </g>

  <g text-anchor="middle" font-size="13" fill="#2563eb" font-weight="700">
    <text x="104" y="40">1</text><text x="314" y="40">2</text><text x="534" y="40">3</text><text x="754" y="40">4</text><text x="980" y="40">5</text>
  </g>

  <text x="550" y="205" text-anchor="middle" class="s" style="font-size:15px">Names, NIC numbers and positions never reach Robin's database or the blockchain.</text>
  <text x="550" y="228" text-anchor="middle" class="s">Only a commitment is published, and only the answer to the verifier's question.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
