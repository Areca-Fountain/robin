<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Robin: tamper-proof, privacy-first service letters" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081a52"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.12"/>
    </pattern>
    <style>
      .float { animation: float 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .d1 { animation-delay: -0.8s; }
      .d2 { animation-delay: -1.6s; }
      .d3 { animation-delay: -2.4s; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      .flow { stroke-dasharray: 6 8; animation: flow 1.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
      .tick { stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw 3s ease-in-out infinite; }
      @keyframes draw { 0%, 15% { stroke-dashoffset: 40; } 45%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 40; } }
      text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#dots)"/>
  <rect width="1200" height="320" rx="24" fill="url(#glow)"/>

  <!-- title -->
  <text x="64" y="150" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="-2">Robin</text>
  <text x="68" y="196" font-size="26" font-weight="600" fill="#dbeafe">Tamper-proof, privacy-first service letters</text>
  <text x="68" y="228" font-size="17" fill="#bfdbfe">Verify employment in seconds. Share only the facts that matter.</text>

  <!-- chips -->
  <g font-size="15" font-weight="600">
    <rect x="68" y="252" width="104" height="32" rx="16" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="120" y="273" fill="#ffffff" text-anchor="middle">Cardano</text>
    <rect x="184" y="252" width="104" height="32" rx="16" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="236" y="273" fill="#ffffff" text-anchor="middle">Midnight</text>
    <rect x="300" y="252" width="104" height="32" rx="16" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="352" y="273" fill="#ffffff" text-anchor="middle">Next.js</text>
  </g>

  <!-- chain of blocks -->
  <g stroke="#93c5fd" stroke-width="3" stroke-linecap="round" fill="none">
    <line class="flow" x1="780" y1="160" x2="824" y2="160"/>
    <line class="flow" x1="914" y1="160" x2="958" y2="160"/>
    <line class="flow" x1="1048" y1="160" x2="1092" y2="160"/>
  </g>

  <!-- 1: letter -->
  <g class="float">
    <rect x="690" y="112" width="90" height="96" rx="16" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="708" y="132" width="54" height="7" rx="3.5" fill="#1d4ed8"/>
    <rect x="708" y="148" width="42" height="6" rx="3" fill="#93c5fd"/>
    <rect x="708" y="162" width="54" height="6" rx="3" fill="#93c5fd"/>
    <rect x="708" y="176" width="30" height="6" rx="3" fill="#93c5fd"/>
  </g>

  <!-- 2: hash -->
  <g class="float d1">
    <rect x="824" y="112" width="90" height="96" rx="16" fill="#ffffff" fill-opacity="0.95"/>
    <text x="869" y="178" font-size="58" font-weight="800" fill="#1d4ed8" text-anchor="middle">#</text>
  </g>

  <!-- 3: lock -->
  <g class="float d2">
    <rect x="958" y="112" width="90" height="96" rx="16" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M985 150 v-10 a18 18 0 0 1 36 0 v10" fill="none" stroke="#1d4ed8" stroke-width="7" stroke-linecap="round"/>
    <rect x="978" y="150" width="50" height="38" rx="8" fill="#1d4ed8"/>
    <circle cx="1003" cy="167" r="5" fill="#ffffff" class="pulse"/>
  </g>

  <!-- 4: verified -->
  <g class="float d3">
    <rect x="1092" y="112" width="90" height="96" rx="16" fill="#ffffff" fill-opacity="0.95"/>
    <circle cx="1137" cy="160" r="30" fill="#16a34a"/>
    <path class="tick" d="M1123 160 l10 11 l19 -22" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="735" y="244" font-size="14" fill="#dbeafe" text-anchor="middle">Issue</text>
  <text x="869" y="244" font-size="14" fill="#dbeafe" text-anchor="middle">Hash</text>
  <text x="1003" y="244" font-size="14" fill="#dbeafe" text-anchor="middle">Lock on-chain</text>
  <text x="1137" y="244" font-size="14" fill="#dbeafe" text-anchor="middle">Verify</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
